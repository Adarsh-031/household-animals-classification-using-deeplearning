[project]
name = "household-animals-classification-using-deep-learning"
version = "0.1.0"
description = "Cat and dog classifier with Grad-CAM explanations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit==1.65.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "pillow==12.3.0",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
